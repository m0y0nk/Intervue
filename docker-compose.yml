services:
  executor:
    build:
      context: ./executor
      dockerfile: Dockerfile
    container_name: intervue_executor
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8001:8001"
    networks:
      - intervue_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intervue_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - EXECUTOR_URL=http://executor:8001
      - DATABASE_URL=sqlite:////data/intervue.db
      - GEMINI_MODEL=gemini-3.6-flash
    volumes:
      - intervue_data:/data
    ports:
      - "8000:8000"
    depends_on:
      - executor
    networks:
      - intervue_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intervue_frontend
    restart: unless-stopped
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - intervue_net

volumes:
  intervue_data:

networks:
  intervue_net:
    driver: bridge
